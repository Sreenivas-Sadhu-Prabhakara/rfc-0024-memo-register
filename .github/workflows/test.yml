name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/memo24 -html < examples/distribution.json | diff -u docs/index.html -
      - run: go run ./cmd/linkbudget25 -html < cmd/linkbudget25/trace.json | diff -u docs/rfc25/index.html -
      - run: go run ./cmd/memo27 -html < cmd/memo27/revision.json | diff -u docs/rfc27/index.html -
      - run: go run ./cmd/clock28 -html < cmd/clock28/samples.json | diff -u docs/rfc28/index.html -
      - run: go run ./cmd/resolution29 -html < cmd/resolution29/samples.json | diff -u docs/rfc29/index.html -
      - run: go run ./cmd/directory30 -html < cmd/directory30/directory.json | diff -u docs/rfc30/index.html -
      - run: go run ./cmd/fields31 -html < cmd/fields31/fields.json | diff -u docs/rfc31/index.html -
      - run: go run ./cmd/trace32 -html < cmd/trace32/samples.json | diff -u docs/rfc32/index.html -
      - run: go run ./cmd/sockets33 -html < cmd/sockets33/sockets.json | diff -u docs/rfc33/index.html -
      - run: go run ./cmd/rollover34 -html < cmd/rollover34/samples.json | diff -u docs/rfc34/index.html -
      - run: go run ./cmd/review35 -html < cmd/review35/reviews.json | diff -u docs/rfc35/index.html -
      - run: go run ./cmd/handshake36 -html < cmd/handshake36/traces.json | diff -u docs/rfc36/index.html -
